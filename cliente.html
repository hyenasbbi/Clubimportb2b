<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Tarjeta privada del Club IMPORTB2B.">
  <title>Mi tarjeta | Club IMPORTB2B</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/multiclub-v3.css">
</head>
<body class="client-page">
  <header class="client-header">
    <a class="brand" href="/" aria-label="Club IMPORTB2B, inicio">
<img src="/assets/logo-importb2b.png"
     class="brand-logo"
     alt="IMPORTB2B"
     width="58"
     height="58"
     style="width:58px;height:58px;max-width:58px;max-height:58px;object-fit:contain;">      
      <span class="brand-copy"><strong>IMPORTB2B</strong><small>CLUB DE CLIENTES</small></span>
    </a>
    <span class="secure-label">ENLACE PRIVADO</span>
  </header>

  <main class="client-shell">
    <section id="loadingState" class="state-panel" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <h1>Cargando tu tarjeta</h1>
      <p>Estamos consultando tu información de manera segura.</p>
    </section>

    <section id="errorState" class="state-panel state-panel--error" hidden>
      <span class="state-icon" aria-hidden="true">!</span>
      <h1>No pudimos abrir la tarjeta</h1>
      <p id="errorMessage">Verifica el enlace e inténtalo nuevamente.</p>
      <a class="button button--ghost" href="/">Volver al inicio</a>
    </section>

    <div id="cardContent" hidden></div>
  </main>

  <footer class="site-footer site-footer--client">
    <span>Club IMPORTB2B</span>
    <span>Tu enlace es personal. No lo compartas públicamente.</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.example.js"></script>
  <script src="/assets/js/supabaseClient.js"></script>
  <script src="/assets/js/cliente.js"></script>
</body>
</html>
